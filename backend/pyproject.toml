[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sage-backend"
version = "0.1.0"
description = "Sage AI coaching app — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.48",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "psycopg2-binary>=2.9",
    "pgvector>=0.4",
    "anthropic>=0.97",
    "python-dotenv>=1.2",
    "pydantic-settings>=2.14",
    "pydantic>=2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
